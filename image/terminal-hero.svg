<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Yudhis terminal profile banner</title>
  <desc id="description">A dark terminal window introducing Yudhis, a software engineer building meaningful products.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#161B22"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#30363D" stroke-opacity="0.32"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="18" fill="url(#background)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>
  <rect x="52" y="42" width="1096" height="276" rx="12" fill="#010409" stroke="#30363D"/>
  <path d="M52 94H1148" stroke="#30363D"/>
  <circle cx="82" cy="68" r="7" fill="#FF5F57"/>
  <circle cx="106" cy="68" r="7" fill="#FEBC2E"/>
  <circle cx="130" cy="68" r="7" fill="#28C840"/>
  <text x="164" y="74" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15">yudhis@workspace: ~</text>
  <text x="94" y="146" fill="#3FB950" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18">$</text>
  <text x="120" y="146" fill="#C9D1D9" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18">whoami</text>
  <text x="94" y="208" fill="#F0F6FC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="48" font-weight="700" letter-spacing="-2">YUDHIS</text>
  <text x="96" y="250" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20">software engineer // building meaningful products</text>
  <rect x="96" y="274" width="12" height="22" rx="1" fill="#58A6FF" filter="url(#glow)"/>
</svg>
